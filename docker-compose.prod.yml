name: ad-wiki-prod

x-api-environment: &api-environment
  NODE_ENV: ${API_NODE_ENV:-production}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-adwiki}
  POSTGRES_DB: ${POSTGRES_DB:-adwiki_wiki}
  REDIS_URL: redis://redis:6379
  WEB_URL: ${APP_ORIGIN:?APP_ORIGIN must be set}
  OIDC_PUBLIC_API_URL: ${APP_ORIGIN:?APP_ORIGIN must be set}
  OIDC_ALLOWED_PRIVATE_HOSTS: ${OIDC_ALLOWED_PRIVATE_HOSTS:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
  TRUST_PROXY_HOPS: "1"
  LOG_FORMAT: json
  UPLOAD_DIR: /app/uploads
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
  JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
  PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
  THROTTLE_TTL: ${THROTTLE_TTL:-60000}
  THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
  MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:?MCP_PUBLIC_URL must be set}
  MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:?MCP_ALLOWED_HOSTS must be set}
  MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:?MCP_ALLOWED_ORIGINS must be set}
  MCP_RATE_LIMIT_READ: ${MCP_RATE_LIMIT_READ:-120}
  MCP_RATE_LIMIT_WRITE: ${MCP_RATE_LIMIT_WRITE:-30}
  MCP_RATE_LIMIT_WINDOW_MS: ${MCP_RATE_LIMIT_WINDOW_MS:-60000}
  MCP_OAUTH_ACCESS_TOKEN_TTL_SECONDS: ${MCP_OAUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
  MCP_OAUTH_REFRESH_TOKEN_TTL_SECONDS: ${MCP_OAUTH_REFRESH_TOKEN_TTL_SECONDS:-2592000}
  MCP_OAUTH_REQUEST_TTL_SECONDS: ${MCP_OAUTH_REQUEST_TTL_SECONDS:-600}
  MCP_OAUTH_CODE_TTL_SECONDS: ${MCP_OAUTH_CODE_TTL_SECONDS:-300}
  MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
  MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
  MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-}
  AD_WIKI_VERSION: ${AD_WIKI_VERSION:-0.1.0}
  BACKUP_STALE_AFTER_HOURS: ${BACKUP_STALE_AFTER_HOURS:-26}
  BACKUP_WORKER_STALE_AFTER_SECONDS: ${BACKUP_WORKER_STALE_AFTER_SECONDS:-60}
  BACKUP_SCHEDULE_GRACE_MINUTES: ${BACKUP_SCHEDULE_GRACE_MINUTES:-5}
  UPLOAD_DISK_WARNING_FREE_PERCENT: ${UPLOAD_DISK_WARNING_FREE_PERCENT:-15}
  UPLOAD_DISK_CRITICAL_FREE_PERCENT: ${UPLOAD_DISK_CRITICAL_FREE_PERCENT:-8}
  TLS_CERT_FILE: /run/tls/server.crt

x-backup-environment: &backup-environment
  NODE_ENV: production
  REDIS_URL: redis://redis:6379
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-adwiki}
  POSTGRES_DB: ${POSTGRES_DB:-adwiki_wiki}
  BACKUP_UPLOADS_DIR: /data/uploads
  BACKUP_UPLOAD_OWNER_UID: ${BACKUP_UID:-1000}
  BACKUP_UPLOAD_OWNER_GID: ${BACKUP_GID:-1000}
  BACKUP_MOUNTS_JSON: '{"local":"/data/backups","network":"/data/network-backups"}'
  BACKUP_STAGING_DIR: /data/backups/.staging
  BACKUP_RESTORE_MOUNT: local
  BACKUP_RESTORE_SUBDIRECTORY: restore
  BACKUP_POLL_INTERVAL_MS: ${BACKUP_POLL_INTERVAL_MS:-2000}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adwiki}
      POSTGRES_DB: ${POSTGRES_DB:-adwiki_wiki}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  database-init:
    image: ${AD_WIKI_IMAGE_PREFIX:-ghcr.io/alid-it/ad-wiki}-database-init:${AD_WIKI_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: bootstrap
    environment:
      <<: *api-environment
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?INITIAL_ADMIN_EMAIL must be set}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:?INITIAL_ADMIN_USERNAME must be set}
      INITIAL_ADMIN_DISPLAY_NAME: ${INITIAL_ADMIN_DISPLAY_NAME:?INITIAL_ADMIN_DISPLAY_NAME must be set}
      SITE_NAME: ${SITE_NAME:-AD-Wiki}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
    secrets:
      - postgres_password
      - initial_admin_password
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  api:
    image: ${AD_WIKI_IMAGE_PREFIX:-ghcr.io/alid-it/ad-wiki}-api:${AD_WIKI_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: runtime
    restart: unless-stopped
    environment: *api-environment
    secrets:
      - postgres_password
      - jwt_secret
      - monitoring_token
      - integration_encryption_key
      - sso_encryption_key
      - backup_encryption_key
      - microsoft_client_secret
    volumes:
      - uploads_data:/app/uploads
      - tls_data:/run/tls:ro
    depends_on:
      database-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend
      - frontend

  backup-storage-init:
    image: alpine:3.22
    restart: "no"
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    environment:
      BACKUP_UID: ${BACKUP_UID:-1000}
      BACKUP_GID: ${BACKUP_GID:-1000}
    volumes:
      - type: bind
        source: ${BACKUP_LOCAL_PATH:-./backups}
        target: /data/backups
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /data/backups/.staging /data/backups/restore
        chown "$${BACKUP_UID}:$${BACKUP_GID}" \
          /data/backups \
          /data/backups/.staging \
          /data/backups/restore
        chmod 0750 \
          /data/backups \
          /data/backups/.staging \
          /data/backups/restore

  backup-worker:
    image: ${AD_WIKI_IMAGE_PREFIX:-ghcr.io/alid-it/ad-wiki}-backup:${AD_WIKI_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    restart: unless-stopped
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment: *backup-environment
    secrets:
      - postgres_password
      - backup_encryption_key
    volumes:
      - uploads_data:/data/uploads:ro
      - type: bind
        source: ${BACKUP_LOCAL_PATH:-./backups}
        target: /data/backups
      - type: bind
        source: ${BACKUP_NETWORK_PATH:-./backups}
        target: /data/network-backups
    tmpfs:
      - /tmp
    depends_on:
      backup-storage-init:
        condition: service_completed_successfully
      database-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -d /data/backups/.staging && test -w /data/backups/.staging"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend
      - backup-egress

  backup-restore:
    profiles: ["operations"]
    image: ${AD_WIKI_IMAGE_PREFIX:-ghcr.io/alid-it/ad-wiki}-backup:${AD_WIKI_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    restart: "no"
    # Der einmalige Offline-Restore muss auch ein fabrikneues, root-eigenes
    # Docker-Volume befüllen können. Der dauerhafte Worker bleibt unprivilegiert.
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
    environment: *backup-environment
    secrets:
      - postgres_password
    volumes:
      - uploads_data:/data/uploads
      - type: bind
        source: ${BACKUP_LOCAL_PATH:-./backups}
        target: /data/backups
        read_only: true
      - type: bind
        source: ${BACKUP_NETWORK_PATH:-./backups}
        target: /data/network-backups
        read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
    command: ["restore", "--help"]
    networks:
      - backend

  web:
    image: ${AD_WIKI_IMAGE_PREFIX:-ghcr.io/alid-it/ad-wiki}-web:${AD_WIKI_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${APP_ORIGIN:?APP_ORIGIN must be set}/api/v1
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - frontend

  tls-init:
    image: ${AD_WIKI_IMAGE_PREFIX:-ghcr.io/alid-it/ad-wiki}-tls-init:${AD_WIKI_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
      target: tls-init
    environment:
      TLS_DOMAIN: ${TLS_DOMAIN:-}
      TLS_FALLBACK_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost}
      TLS_SELF_SIGNED_DAYS: ${TLS_SELF_SIGNED_DAYS:-825}
      TLS_CERT_PROVIDED: ${TLS_CERT_PATH:+true}
      TLS_KEY_PROVIDED: ${TLS_KEY_PATH:+true}
      TLS_CHAIN_PROVIDED: ${TLS_CA_CHAIN_PATH:+true}
    volumes:
      - type: bind
        source: ${TLS_CERT_PATH:-./docker/nginx/placeholders/not-configured.crt}
        target: /input/server.crt
        read_only: true
      - type: bind
        source: ${TLS_KEY_PATH:-./docker/nginx/placeholders/not-configured.key}
        target: /input/server.key
        read_only: true
      - type: bind
        source: ${TLS_CA_CHAIN_PATH:-./docker/nginx/placeholders/not-configured-chain.crt}
        target: /input/ca-chain.crt
        read_only: true
      - tls_data:/tls
    network_mode: "none"
    restart: "no"

  nginx:
    image: ${AD_WIKI_IMAGE_PREFIX:-ghcr.io/alid-it/ad-wiki}-nginx:${AD_WIKI_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - tls_data:/etc/nginx/tls:ro
    depends_on:
      tls-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--tries=1", "--spider", "https://127.0.0.1/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - frontend

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  tls_data:

networks:
  backend:
    internal: true
  backup-egress:
  frontend:

secrets:
  postgres_password:
    environment: AD_WIKI_POSTGRES_PASSWORD
  jwt_secret:
    environment: AD_WIKI_JWT_SECRET
  monitoring_token:
    environment: AD_WIKI_MONITORING_TOKEN
  integration_encryption_key:
    environment: AD_WIKI_INTEGRATION_ENCRYPTION_KEY
  sso_encryption_key:
    environment: AD_WIKI_SSO_ENCRYPTION_KEY
  backup_encryption_key:
    environment: AD_WIKI_BACKUP_ENCRYPTION_KEY
  microsoft_client_secret:
    environment: AD_WIKI_MICROSOFT_CLIENT_SECRET
  initial_admin_password:
    environment: AD_WIKI_INITIAL_ADMIN_PASSWORD
