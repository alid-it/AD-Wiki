upstream ad_wiki_api {
  server api:4000;
  keepalive 32;
}

upstream ad_wiki_web {
  server web:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name _;
  server_tokens off;
  return 308 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;
  server_tokens off;
  client_max_body_size 12m;

  ssl_certificate /etc/nginx/tls/fullchain.crt;
  ssl_certificate_key /etc/nginx/tls/server.key;
  ssl_trusted_certificate /etc/nginx/tls/ca-chain.crt;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:AD_WIKI_TLS:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location ^~ /api/ {
    proxy_pass http://ad_wiki_api;
    include /etc/nginx/snippets/ad-wiki-proxy.conf;
  }

  location ^~ /uploads/ {
    return 403;
  }

  location ^~ /socket.io/ {
    proxy_pass http://ad_wiki_api;
    include /etc/nginx/snippets/ad-wiki-proxy.conf;
  }

  location ^~ /mcp {
    proxy_pass http://ad_wiki_api;
    # Einige MCP-Clients senden die initialized-Notification auf einer wiederverwendeten
    # HTTP/1.1-Verbindung fehlerhaft. Eine frische Verbindung pro Request verhindert den
    # Nginx-400 vor dem Upstream; aktive SSE-Antworten bleiben davon unberührt.
    keepalive_timeout 0;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    include /etc/nginx/snippets/ad-wiki-proxy.conf;
  }

  location ^~ /.well-known/ {
    proxy_pass http://ad_wiki_api;
    include /etc/nginx/snippets/ad-wiki-proxy.conf;
  }

  location ^~ /oauth/ {
    proxy_pass http://ad_wiki_api;
    include /etc/nginx/snippets/ad-wiki-proxy.conf;
  }

  location / {
    proxy_pass http://ad_wiki_web;
    include /etc/nginx/snippets/ad-wiki-proxy.conf;
  }
}
