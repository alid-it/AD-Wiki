name: Bug Report
description: Report a reproducible problem with AD-Wiki
title: "[Bug]: "
labels:
  - bug
  - triage

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem with AD-Wiki.

        Please do not include passwords, access tokens, API keys,
        session cookies or other sensitive information.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of AD-Wiki is affected?
      options:
        - Web interface
        - API
        - Background worker
        - Authentication / SSO
        - Users / Groups / Permissions
        - Editor / Pages
        - Search
        - Backup / Restore
        - Import / Export
        - MCP integration
        - Docker / Deployment
        - Documentation
        - General / Multiple areas
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: AD-Wiki version
      description: Enter the release version or container tag.
      placeholder: "Example: v1.0.1"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Docker Compose
        - Manual development setup
        - Other
    validations:
      required: true

  - type: input
    id: operating-system
    attributes:
      label: Host operating system
      placeholder: "Example: Debian 13 amd64"
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      description: Required only for problems involving the web interface.
      placeholder: "Example: Firefox 142 or Chrome 140"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Describe what happened and what you expected.
      placeholder: |
        What happened?
        What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Configure...
        3. Click...
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove passwords, tokens, cookies and personal information.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots or other relevant information.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for duplicates.
          required: true
        - label: I removed passwords, tokens and other sensitive information.
          required: true
